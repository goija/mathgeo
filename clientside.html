<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRTC // Ruimtetijd-Brug (Rust Node)</title>
    <style>
        body { 
            background-color: #0a0a0c; 
            color: #d4d4d6; 
            font-family: 'Courier New', Courier, monospace; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px;
        }
        .viewport-container {
            display: flex;
            gap: 20px;
            margin: 20px 0;
        }
        video { 
            border: 1px solid #4a5568; 
            width: 480px; 
            height: 360px;
            background: #000; 
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.1);
        }
        #telemetry { 
            width: 980px; 
            height: 200px; 
            overflow-y: auto; 
            border: 1px solid #4a5568; 
            padding: 10px; 
            background: #111;
            font-size: 0.85em;
        }
        button {
            background-color: #2c5282;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover { background-color: #2b6cb0; }
        .log-entry { margin-bottom: 4px; }
        .log-sys { color: #a0aec0; }
        .log-ice { color: #48bb78; }
        .log-signal { color: #ecc94b; }
    </style>
</head>
<body>

    <h2>VORTEX // WebRTC Vector Overlay</h2>
    
    <div class="viewport-container">
        <!-- Lokaal nulpunt (Laren) -->
        <video id="localSpace" autoplay muted playsinline></video>
        <!-- De antipode / remote node (New York / Stockholm) -->
        <video id="remoteSpace" autoplay playsinline></video>
    </div>

    <button id="initBtn">Kalibreer Fotonen-stroom (Start)</button>

    <div id="telemetry"></div>

    <script>
        const localVideo = document.getElementById('localSpace');
        const remoteVideo = document.getElementById('remoteSpace');
        const telemetry = document.getElementById('telemetry');
        const initBtn = document.getElementById('initBtn');

        // STUN servers fungeren als de peilstokken om door de NAT-lagen heen te kijken
        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        let peerConnection;
        let localStream;
        
        // De verbinding met je Rust (Axum/Tungstenite) signaling server
        const ws = new WebSocket('ws://127.0.0.1:3000/signaling');

        function log(msg, type = 'sys') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toISOString().split('T')[1].slice(0, -1);
            entry.textContent = `[${time}] ${msg}`;
            telemetry.appendChild(entry);
            telemetry.scrollTop = telemetry.scrollHeight;
        }

        ws.onopen = () => log("Luo Pan verankerd: WebSocket verbonden met Rust backend.", "sys");
        ws.onerror = (err) => log("Verbindingsfout met signaling server. Draait de Rust node?", "sys");

        ws.onmessage = async (event) => {
            const message = JSON.parse(event.data);
            log(`Signaal ontvangen: ${message.type}`, "signal");

            if (!peerConnection) createPeerConnection();

            try {
                if (message.type === 'offer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
                    const answer = await peerConnection.createAnswer();
                    await peerConnection.setLocalDescription(answer);
                    ws.send(JSON.stringify({ type: 'answer', answer: answer }));
                    log("Tegenwind berekend: Answer teruggestuurd.", "signal");
                } 
                else if (message.type === 'answer') {
                    await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
                    log("Vector-overlay bevestigd: Remote description ingesteld.", "signal");
                } 
                else if (message.type === 'ice-candidate') {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
                    log(`ICE Candidate drift gecompenseerd.`, "ice");
                }
            } catch (error) {
                log(`Fout tijdens ruimtetijd-kalibratie: ${error}`, "sys");
            }
        };

        async function startStream() {
            try {
                // Fotonen vangen via de lokale lens
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                localVideo.srcObject = localStream;
                log("Lokale optische sensor geactiveerd.", "sys");

                createPeerConnection();

                // Initiëer het contact
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: 'offer', offer: offer }));
                log("Aanvraag voor ruimtetijd-brug verzonden (Offer).", "signal");
                
                initBtn.disabled = true;
                initBtn.style.backgroundColor = "#4a5568";
            } catch (err) {
                log(`Fout bij benaderen media-invoer: ${err}`, "sys");
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);

            if (localStream) {
                localStream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, localStream);
                });
            }

            peerConnection.ontrack = (event) => {
                log("Brug geopend: Inkomende fotonenstroom gedetecteerd.", "sys");
                if (remoteVideo.srcObject !== event.streams[0]) {
                    remoteVideo.srcObject = event.streams[0];
                }
            };

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    log("Nieuwe navigatievector (ICE Candidate) gevonden, verzenden...", "ice");
                    ws.send(JSON.stringify({ type: 'ice-candidate', candidate: event.candidate }));
                }
            };

            peerConnection.onconnectionstatechange = () => {
                log(`Brug status: ${peerConnection.connectionState.toUpperCase()}`, "sys");
            };
        }

        initBtn.addEventListener('click', startStream);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC Traffic Cameras - Dual Viewport Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #e2e8f0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Viewport 1: Linker schermhelft (Camera Feed & Details) */
        .viewport-preview {
            flex: 1;
            background: #1a202c;
            border-right: 2px solid #2d3748;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            text-align: center;
        }
        .preview-container {
            width: 100%;
            max-width: 600px;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .preview-container h2 {
            font-size: 1.2rem;
            color: #60a5fa;
            margin-bottom: 15px;
        }
        .camera-screen {
            width: 100%;
            height: 320px;
            background: #000;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            border: 1px solid #4a5568;
        }
        .camera-screen img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .camera-info {
            margin-top: 15px;
            font-size: 0.95rem;
            color: #9ca3af;
            text-align: left;
        }
        .camera-info span {
            color: #f3f4f6;
            font-weight: bold;
        }

        /* Viewport 2: Rechter schermhelft (Lijst & Categorieën) */
        .viewport-list {
            flex: 1;
            background: #111827;
            padding: 30px;
            overflow-y: auto;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #f7fafc;
            border-bottom: 2px solid #374151;
            padding-bottom: 10px;
        }
        .accordion {
            background-color: #1f2937;
            color: #f3f4f6;
            cursor: pointer;
            padding: 15px;
            width: 100%;
            text-align: left;
            border: 1px solid #374151;
            outline: none;
            transition: 0.3s;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 8px;
            border-radius: 6px;
        }
        .active, .accordion:hover {
            background-color: #374151;
            color: #60a5fa;
        }
        .panel {
            padding: 10px 15px;
            background-color: #1a202c;
            display: none;
            overflow: hidden;
            border: 1px solid #374151;
            border-top: none;
            border-radius: 0 0 6px 6px;
            margin-bottom: 5px;
            max-height: 250px;
            overflow-y: auto;
        }
        ul {
            list-style-type: none;
        }
        li {
            margin: 8px 0;
        }
        li a {
            color: #93c5fd;
            text-decoration: none;
            font-size: 0.9rem;
            cursor: pointer;
            transition: color 0.2s;
        }
        li a:hover {
            color: #60a5fa;
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            body {
                flex-direction: column;
                height: auto;
                overflow: auto;
            }
            .viewport-preview {
                height: 450px;
            }
        }
    </style>
</head>
<body>

    <!-- VIEWPORT 1: Live Feed & Details -->
    <div class="viewport-preview">
        <div class="preview-container">
            <h2 id="cam-title">Selecteer een Camera</h2>
            <div class="camera-screen" id="cam-screen-container">
                <p style="color: #718096;">Geen feed geselecteerd</p>
            </div>
            <div class="camera-info" id="cam-details">
                Locatie: <span>-</span><br>
                Coördinaten: <span>-</span><br>
                Status: <span>-</span>
            </div>
        </div>
    </div>

    <!-- VIEWPORT 2: Dashboard & Camera Lijsten per Gebied -->
    <div class="viewport-list">
        <h1>NYC Traffic Cameras</h1>
        
        <button class="accordion">Manhattan</button>
        <div class="panel"><ul id="manhattan"></ul></div>
        
        <button class="accordion">Brooklyn</button>
        <div class="panel"><ul id="brooklyn"></ul></div>
        
        <button class="accordion">Queens</button>
        <div class="panel"><ul id="queens"></ul></div>

        <button class="accordion">Bronx</button>
        <div class="panel"><ul id="bronx"></ul></div>

        <button class="accordion">Staten Island</button>
        <div class="panel"><ul id="statenIsland"></ul></div>

        <button class="accordion">Derry City</button>
        <div class="panel"><ul id="derryCity"></ul></div>
    </div>

        ];

        // Sorteer alfabetisch
        allCameras.sort((a, b) => a.name.localeCompare(b.name));

        // Vul lijsten in per stadsdeel
        allCameras.forEach(camera => {
            let el = document.createElement('li');
            let link = document.createElement('a');
            link.innerText = camera.name;
            link.onclick = () => selectCamera(camera);
            el.appendChild(link);

            switch (camera.area) {
                case 'Manhattan': document.getElementById("manhattan").appendChild(el); break;
                case 'Brooklyn': document.getElementById("brooklyn").appendChild(el); break;
                case 'Queens': document.getElementById("queens").appendChild(el); break;
                case 'Bronx': document.getElementById("bronx").appendChild(el); break;
                case 'Staten Island': document.getElementById("statenIsland").appendChild(el); break;
                case 'Derry City': document.getElementById("derryCity").appendChild(el); break;
            }
        });

        function selectCamera(camera) {
            document.getElementById("cam-title").innerText = camera.name;
            
            // Voeg een unieke tijdstempel toe om caching te voorkomen en de feed te forceren
            let feedUrl = camera.imageUrl.includes('?') ? camera.imageUrl + '&t=' + new Date().getTime() : camera.imageUrl + '?t=' + new Date().getTime();
            
            document.getElementById("cam-screen-container").innerHTML = `
                <img src="${feedUrl}" alt="${camera.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/600x320?text=Feed+Niet+Beschikbaar+%28Mogelijk+Geo-blokkade%29';">
            `;
            
            document.getElementById("cam-details").innerHTML = `
                Locatie: <span>${camera.area}</span><br>
                Coördinaten: <span>${camera.latitude}, ${camera.longitude}</span><br>
                Status: <span style="color: #4ade80;">Online</span>
            `;
        }

        // Accordeon functionaliteit
        var acc = document.getElementsByClassName("accordion");
        for (let i = 0; i < acc.length; i++) {
            acc[i].addEventListener("click", function() {
                this.classList.toggle("active");
                var panel = this.nextElementSibling;
                panel.style.display = panel.style.display === "block" ? "none" : "block";
            });
        }
    </script>
</body>
</html>

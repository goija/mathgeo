<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX // Kalenderronde Kalibrator</title>
    <style>
        body {
            background-color: #050508;
            color: #48bb78;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #dashboard {
            display: flex;
            gap: 20px;
            background: #0a0a10;
            border: 1px solid #2d3748;
            padding: 20px;
            box-shadow: 0 0 20px rgba(72, 187, 120, 0.1);
            position: relative;
        }
        .canvas-container {
            position: relative;
            width: 500px;
            height: 500px;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            border: 1px solid #1a202c;
            border-radius: 50%;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
        }
        #telemetry {
            width: 350px;
            height: 500px;
            background: #000;
            border: 1px solid #2d3748;
            padding: 15px;
            overflow-y: auto;
            font-size: 0.85em;
            color: #a0aec0;
            box-sizing: border-box;
        }
        .telemetry-header {
            color: #e2e8f0;
            border-bottom: 1px solid #4a5568;
            padding-bottom: 5px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .log-entry { margin-bottom: 6px; line-height: 1.3; }
        .log-highlight { color: #f6e05e; }
        .log-alert { color: #e53e3e; }
        .log-success { color: #48bb78; }
        button {
            position: absolute;
            bottom: -50px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #2c5282;
            color: white;
            border: 1px solid #4299e1;
            padding: 10px 20px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: inherit;
            transition: all 0.3s;
        }
        button:hover {
            background-color: #2b6cb0;
            box-shadow: 0 0 10px #4299e1;
        }
    </style>
</head>
<body>

    <div id="dashboard">
        <div class="canvas-container">
            <!-- Achtergrond Luo Pan en Cycli -->
            <canvas id="mayaRings" width="500" height="500"></canvas>
            <!-- Voorgrond Luchtvaartplotter & Vectoren -->
            <canvas id="vectorOverlay" width="500" height="500"></canvas>
        </div>
        
        <div id="telemetry">
            <div class="telemetry-header">VORTEX NODE: LAREN (52.27°N, 5.22°E)</div>
            <div id="logContent"></div>
        </div>

        <button id="startBtn">Initieer 18.980 Kalibratie</button>
    </div>

    <script>
        const canvasRings = document.getElementById('mayaRings');
        const ctxRings = canvasRings.getContext('2d');
        const canvasVectors = document.getElementById('vectorOverlay');
        const ctxVectors = canvasVectors.getContext('2d');
        const logContent = document.getElementById('logContent');
        const startBtn = document.getElementById('startBtn');

        let isCalibrating = false;
        let dayCounter = 0;
        let tzolkinAngle = 0;
        let haabAngle = 0;
        const targetDays = 18980; // De Kalenderronde
        const centerX = 250;
        const centerY = 250;

        function log(msg, type = '') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            const time = new Date().toISOString().split('T')[1].slice(0, -1);
            entry.innerHTML = `[${time}] ${msg}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        function drawStaticLuoPan() {
            ctxRings.clearRect(0, 0, 500, 500);
            ctxRings.lineWidth = 1;
            
            // Buitenste ring (Kosmische ruimte)
            ctxRings.strokeStyle = "#2d3748";
            ctxRings.beginPath(); ctxRings.arc(centerX, centerY, 240, 0, Math.PI * 2); ctxRings.stroke();
            ctxRings.beginPath(); ctxRings.arc(centerX, centerY, 200, 0, Math.PI * 2); ctxRings.stroke();
            
            // Rasterlijnen
            for(let i=0; i<360; i+=15) {
                const rad = i * (Math.PI / 180);
                ctxRings.beginPath();
                ctxRings.moveTo(centerX + Math.cos(rad) * 200, centerY + Math.sin(rad) * 200);
                ctxRings.lineTo(centerX + Math.cos(rad) * 240, centerY + Math.sin(rad) * 240);
                ctxRings.stroke();
            }
        }

        function drawRings() {
            // Wis alleen het binnenste gedeelte voor de animatie
            ctxRings.clearRect(10, 10, 480, 480);
            drawStaticLuoPan();

            // Tzolk'in Ring (260 dagen, sneller)
            ctxRings.save();
            ctxRings.translate(centerX, centerY);
            ctxRings.rotate(tzolkinAngle);
            ctxRings.strokeStyle = "#d69e2e"; // Goud
            ctxRings.setLineDash([5, 5]);
            ctxRings.beginPath(); ctxRings.arc(0, 0, 120, 0, Math.PI * 2); ctxRings.stroke();
            ctxRings.setLineDash([]);
            ctxRings.fillStyle = "#d69e2e";
            ctxRings.fillText("TZOLK'IN (260)", -40, -130);
            ctxRings.restore();

            // Haab' Ring (365 dagen, trager)
            ctxRings.save();
            ctxRings.translate(centerX, centerY);
            ctxRings.rotate(haabAngle);
            ctxRings.strokeStyle = "#3182ce"; // Blauw
            ctxRings.setLineDash([10, 5]);
            ctxRings.beginPath(); ctxRings.arc(0, 0, 160, 0, Math.PI * 2); ctxRings.stroke();
            ctxRings.setLineDash([]);
            ctxRings.fillStyle = "#3182ce";
            ctxRings.fillText("HAAB' (365)", -35, -170);
            ctxRings.restore();

            // Het 'Oog' / B'atz' in het midden
            ctxRings.fillStyle = "#1a202c";
            ctxRings.beginPath(); ctxRings.arc(centerX, centerY, 30, 0, Math.PI * 2); ctxRings.fill();
            ctxRings.fillStyle = "#f6e05e";
            ctxRings.font = "bold 16px serif";
            ctxRings.textAlign = "center";
            ctxRings.fillText("B'", centerX, centerY + 5);
        }

        function drawVectors(lock = false) {
            ctxVectors.clearRect(0, 0, 500, 500);

            // Navigatiekruis (Plotter)
            ctxVectors.strokeStyle = "rgba(160, 174, 192, 0.3)";
            ctxVectors.lineWidth = 1;
            ctxVectors.beginPath(); ctxVectors.moveTo(centerX, 0); ctxVectors.lineTo(centerX, 500); ctxVectors.stroke();
            ctxVectors.beginPath(); ctxVectors.moveTo(0, centerY); ctxVectors.lineTo(500, centerY); ctxVectors.stroke();

            // WebRTC Datastroom Vector (Inslaghoek)
            ctxVectors.strokeStyle = lock ? "rgba(72, 187, 120, 0.9)" : "rgba(229, 62, 62, 0.8)";
            ctxVectors.lineWidth = 2;
            
            // Lijn van NW (New York) naar Centrum
            ctxVectors.beginPath();
            ctxVectors.moveTo(50, 50);
            ctxVectors.lineTo(centerX, centerY);
            ctxVectors.stroke();

            // Lijn van NO (Stockholm) naar Centrum
            ctxVectors.beginPath();
            ctxVectors.moveTo(450, 50);
            ctxVectors.lineTo(centerX, centerY);
            ctxVectors.stroke();

            if (lock) {
                ctxVectors.fillStyle = "#48bb78";
                ctxVectors.font = "bold 14px monospace";
                ctxVectors.fillText("PERFECT SYNC: 18.980", centerX - 70, centerY + 50);
                ctxVectors.fillText("Ceci n'est pas une simulation.", centerX - 120, 480);
            }
        }

        function animateCalibration() {
            if (!isCalibrating) return;

            // Snelheidsratio's baseren we op de kalenders
            // Om de animatie zichtbaar te houden, versnellen we de tijd
            const speedMultiplier = 50; 
            dayCounter += speedMultiplier;

            // Hoek berekening (1 volledige rotatie = 260 of 365 dagen)
            tzolkinAngle = (dayCounter % 260) / 260 * Math.PI * 2;
            haabAngle = (dayCounter % 365) / 365 * Math.PI * 2;

            drawRings();
            drawVectors(false);

            // Log de voortgang
            if (dayCounter % 1500 === 0 || dayCounter === speedMultiplier) {
                log(`WebRTC Ping... NY/STO -> Laren. Dagen: ${dayCounter}`);
            }

            // Controleer op de Calendar Round (18.980 dagen)
            if (dayCounter >= targetDays) {
                dayCounter = targetDays;
                tzolkinAngle = 0; // Reset naar 0 bij de sync
                haabAngle = 0;
                drawRings();
                drawVectors(true); // Lock vectors
                isCalibrating = false;
                log(`KGV(260, 365) bereikt = ${targetDays} dagen.`, 'log-highlight');
                log("Kalenderronde voltooid. Venus-resonantie geactiveerd.", 'log-success');
                log("Ruimtetijd-membraan is nu verankerd.", 'log-success');
                return;
            }

            requestAnimationFrame(animateCalibration);
        }

        startBtn.addEventListener('click', () => {
            if(isCalibrating) return;
            log("Initiëren P2P WebRTC handshake...", "log-alert");
            log("Luo Pan raster online. Wachten op fotonen...", "");
            dayCounter = 0;
            isCalibrating = true;
            animateCalibration();
        });

        // Initiële render
        drawStaticLuoPan();
        drawRings();
        drawVectors();
    </script>
</body>
</html>

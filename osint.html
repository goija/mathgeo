<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VORTEX: OSINT Status Dashboard</title>
    <style>
        :root {
            --sky-blue: #87CEEB;
            --cloud-white: #F8F9FA;
            --night-dark: #0B132B;
            --frame-gold: #D4AF37;
            --text-dark: #2F4F4F;
            --color-opgelost: #27AE60;
            --color-onopgelost: #C0392B;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
            background: linear-gradient(to bottom, var(--sky-blue) 0%, var(--sky-blue) 30%, var(--night-dark) 30.5%, var(--night-dark) 100%);
            color: var(--cloud-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding-top: 40px;
        }

        .canvas-frame {
            background-color: var(--cloud-white);
            color: var(--text-dark);
            padding: 30px 40px;
            border: 12px solid #111;
            box-shadow: 
                inset 0 0 0 4px var(--frame-gold),
                15px 20px 30px rgba(0,0,0,0.8);
            max-width: 900px;
            width: 95%;
            position: relative;
            margin-bottom: 50px;
        }

        h1 {
            text-align: center;
            font-weight: normal;
            font-size: 2.2em;
            margin-bottom: 5px;
        }

        .paradox {
            text-align: center;
            font-family: 'Brush Script MT', cursive;
            font-size: 1.8em;
            color: #555;
            margin-bottom: 30px;
        }

        /* Formulier Styling */
        .input-sectie {
            background-color: #EAECEE;
            padding: 20px;
            border-left: 4px solid var(--text-dark);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-family: 'Courier New', Courier, monospace;
        }

        input[type="text"], textarea {
            padding: 10px;
            font-family: 'Courier New', Courier, monospace;
            border: 1px solid #ccc;
            background-color: #fff;
            font-size: 1em;
        }

        .radio-group {
            display: flex;
            gap: 20px;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px 0;
        }

        button {
            background-color: var(--text-dark);
            color: var(--cloud-white);
            border: none;
            padding: 12px 20px;
            font-family: 'Georgia', serif;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
            width: 100%;
        }

        button:hover { background-color: #1A252F; }

        /* Tabel Styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9em;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: var(--text-dark);
            color: var(--cloud-white);
            font-family: 'Georgia', serif;
        }

        .status-opgelost {
            color: var(--color-opgelost);
            font-weight: bold;
        }

        .status-onopgelost {
            color: var(--color-onopgelost);
            font-weight: bold;
        }

        .decor {
            position: absolute;
            top: -25px;
            left: -25px;
            font-size: 50px;
            filter: drop-shadow(2px 4px 6px rgba(0,0,0,0.5));
        }

        .copyright {
            margin-top: 40px;
            font-size: 0.85em;
            text-align: center;
            color: #777;
            font-style: italic;
            border-top: 1px dashed #ccc;
            padding-top: 15px;
        }
    </style>
</head>
<body>

    <div class="canvas-frame">
        <div class="decor">👁️</div>
        
        <h1>Actuele Target Tracking</h1>
        <div class="paradox">Ceci n'est pas un dossier.</div>

        <!-- Invoervelden -->
        <div class="input-sectie">
            <div class="form-group">
                <label for="doelwit">Doelwit / Entiteit:</label>
                <input type="text" id="doelwit" placeholder="Bijv. Salesforce DMP / AS14340">
            </div>
            
            <div class="form-group">
                <label for="coordinaten">Vector (IP, Coördinaten of ASN):</label>
                <input type="text" id="coordinaten" placeholder="Bijv. 198.245.80.0/20 of 40.7548° N">
            </div>

            <div class="form-group">
                <label for="notities">Analytische Notities:</label>
                <textarea id="notities" rows="3" placeholder="Gedetecteerde anomalieën, geodetische shifts..."></textarea>
            </div>

            <div class="radio-group">
                <label>
                    <input type="radio" name="status" value="Opgelost" checked> Opgelost
                </label>
                <label>
                    <input type="radio" name="status" value="Niet Opgelost"> Niet Opgelost
                </label>
            </div>

            <button onclick="voegDossierToe()">Registreer in Rapport</button>
        </div>

        <!-- Rapportage Tabel -->
        <h2>Geaggregeerd OSINT Rapport</h2>
        <table>
            <thead>
                <tr>
                    <th>Tijdstip</th>
                    <th>Doelwit</th>
                    <th>Vector</th>
                    <th>Notities</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="rapport-body">
                <!-- Dynamische rijen verschijnen hier -->
            </tbody>
        </table>

        <div class="copyright">
            <strong>Ontwerp en ontwikkeling:</strong> Bedrijven en overheid hebben geen toestemming tot gebruik of reproductie van deze code.
        </div>
    </div>

    <script>
        function voegDossierToe() {
            const doelwit = document.getElementById('doelwit').value;
            const coordinaten = document.getElementById('coordinaten').value;
            const notities = document.getElementById('notities').value;
            const statusElements = document.getElementsByName('status');
            
            let geselecteerdeStatus;
            for (let i = 0; i < statusElements.length; i++) {
                if (statusElements[i].checked) {
                    geselecteerdeStatus = statusElements[i].value;
                    break;
                }
            }

            if (!doelwit || !coordinaten) {
                alert("Vul minimaal een doelwit en een vector in.");
                return;
            }

            const tbody = document.getElementById('rapport-body');
            const tr = document.createElement('tr');
            
            // Lokale tijd ophalen
            const nu = new Date();
            const tijdstip = nu.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // Bepaal de CSS klasse voor de status weergave
            const statusClass = (geselecteerdeStatus === "Opgelost") ? "status-opgelost" : "status-onopgelost";

            tr.innerHTML = `
                <td>${tijdstip}</td>
                <td><strong>${doelwit}</strong></td>
                <td>${coordinaten}</td>
                <td>${notities}</td>
                <td class="${statusClass}">${geselecteerdeStatus}</td>
            `;

            // Voeg de rij bovenaan toe
            tbody.insertBefore(tr, tbody.firstChild);

            // Maak de formuliervelden weer leeg
            document.getElementById('doelwit').value = '';
            document.getElementById('coordinaten').value = '';
            document.getElementById('notities').value = '';
        }
    </script>
</body>
</html>

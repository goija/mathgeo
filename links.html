<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathGeo Seven | Navigatie & Index</title>
    <style>
        :root {
            --bg-color: #0f141a;
            --panel-bg: #1a222c;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --accent-green: #3fb950;
            --border: #30363d;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 20px;
            margin-bottom: 40px;
        }

        h1 {
            color: #ffffff;
            margin: 0 0 10px 0;
            font-size: 2em;
            letter-spacing: 1px;
        }

        .base-url {
            color: var(--text-muted);
            font-size: 0.9em;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .category-card {
            background-color: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .category-card h2 {
            margin-top: 0;
            color: #ffffff;
            font-size: 1.2em;
            border-bottom: 1px dashed var(--border);
            padding-bottom: 10px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .category-card h2::before {
            content: "►";
            color: var(--accent-green);
            font-size: 0.8em;
            margin-right: 10px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }

        li {
            margin-bottom: 10px;
        }

        a {
            color: var(--accent-blue);
            text-decoration: none;
            display: flex;
            align-items: baseline;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        a::before {
            content: "📄";
            font-size: 0.8em;
            margin-right: 8px;
            filter: grayscale(100%) opacity(0.7);
        }

        a.folder::before {
            content: "📁";
        }
        
        a.script::before {
            content: "⚙️";
        }

        a:hover {
            color: var(--accent-green);
            transform: translateX(5px);
        }

        footer {
            margin-top: 50px;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85em;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
    </style>
</head>
<body>
